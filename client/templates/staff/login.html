{% extends 'staff/base.html' %}{% load static %}
{% block content %}
<section class="login-card">
  <div class="login-brand"><img src="{% static 'images/logo.webp' %}" alt="ByteBistro"></div>
  <div class="login-body">
    <h1>Acesso da equipe</h1>
    <p>Entre para administrar a operação do restaurante.</p>
    {% if problem %}<p role="alert">{{ problem }}</p>{% endif %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary">Entrar no painel</button></form>
    <a href="{% url 'home' %}">Voltar ao cardápio</a>
  </div>
</section>
{% endblock %}
