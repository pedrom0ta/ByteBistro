name: Validate MVP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/web/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/services
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/services/package-lock.json
      - run: npm ci
      - run: npm test

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: bash -n infrastructure/release/build.sh
      - run: bash -n infrastructure/terraform/migration-host.sh.tftpl
      - run: python -m py_compile infrastructure/release/archive.py infrastructure/release/migrate.py infrastructure/release/update-demo.py
      - run: |
          python infrastructure/release/archive.py "$RUNNER_TEMP/bytebistro.zip"
          python -m zipfile -t "$RUNNER_TEMP/bytebistro.zip"
